spring.application.name=devboard

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devboard_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:arshad@123}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# Task attachment uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Local development storage; do not commit uploaded files
devboard.upload-dir=${DEVBOARD_UPLOAD_DIR:uploads}